<head>
<meta charset="utf-8">

<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:#FFFFFF;font-family:Karla,system-ui,sans-serif;color:#12262E;}
  a{color:#64313E;text-decoration:none;}
  a:hover{color:#8A4A5A;}
  @keyframes pulse{0%{transform:scale(1);opacity:.5;}70%{transform:scale(2.1);opacity:0;}100%{transform:scale(2.1);opacity:0;}}
  @keyframes cardIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:none;}}
  @keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
  @keyframes grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}
  @keyframes shot{from{opacity:0;}to{opacity:1;}}
  .btn{padding:10px 18px;border-radius:999px;font-family:Karla,sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid #DCE2E5;background:rgba(255,255,255,.94);color:#5C6E76;}
  .btn:hover{background:#F2F5F7;color:#12262E;}
  .btn-p{border-color:#64313E;background:#64313E;color:#FFFFFF;font-weight:600;}
  .btn-p:hover{background:#7C3D4C;color:#FFFFFF;}
  .dot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid #FFFFFF;background:rgba(18,38,46,.9);color:#FFFFFF;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 4px 12px rgba(30,20,10,.3);transition:background .7s cubic-bezier(.22,.61,.36,1),opacity .7s cubic-bezier(.22,.61,.36,1);}
  .dot.on{background:#64313E;z-index:4;}
  .ring{position:absolute;inset:0;border-radius:50%;background:#64313E;animation:pulse 2.4s ease-out infinite;z-index:1;}
  @media(max-width:700px){.wrap{padding:10px !important;}}
</style>
</head>
<body>
<div class="wrap" style="height:100%;padding:16px 20px;display:flex;align-items:center;justify-content:center;">

    <div id="card" style="display:none;"></div>
    <div id="cover" style="position:absolute;inset:0;z-index:6;background:#FFFFFF;display:flex;align-items:center;padding:clamp(28px,5vw,72px);transition:opacity .85s cubic-bezier(.22,.61,.36,1),transform .85s cubic-bezier(.22,.61,.36,1);"></div>
    <div id="intro" style="position:absolute;inset:0;z-index:7;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:clamp(28px,5vw,72px);transition:opacity .9s cubic-bezier(.22,.61,.36,1);">

        <div style="width:clamp(90px,10vw,140px);height:2px;background:#64313E;margin:clamp(22px,3vw,40px) 0;transform-origin:center;animation:grow .9s cubic-bezier(.22,.61,.36,1) .5s both;"></div>

        <p style="margin:0 0 30px;font-size:clamp(14px,1.5vw,20px);line-height:1.6;color:#5C6E76;max-width:620px;animation:rise 1s cubic-bezier(.22,.61,.36,1) 1.15s both;">Démonstration complète de l'application, module par module, du carnet d'adresses au déroulé du jour J.</p>
        <span style="font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:#6B7780;animation:blink 2.4s ease-in-out 1.8s infinite both;">Cliquez sur suivant pour commencer</span>
      </div>
    </div>
    <div style="position:absolute;z-index:9;bottom:18px;right:18px;display:flex;align-items:center;gap:10px;">
      <span id="counter" style="padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid #DCE2E5;font-size:11.5px;color:#5C6E76;white-space:nowrap;"></span>
      <button class="btn" onclick="step(-1)">&#8592; Retour</button>
      <button class="btn btn-p" onclick="step(1)">Suivant &#8594;</button>
    </div>
  </div>
</div>

   ]},
  {id:"d-documents", group:"dossier", tab:"Documents", title:"Dossier · Documents",
   intro:"Le classeur du mariage : plans, autorisations, attestations, tout ce qui doit être retrouvable.",
   img:"demo-img/d-documents.png",
   h:[
    {x:30,y:19.5,t:"Un classeur par mariage",d:"Plan du domaine, autorisation de tournage drone, attestation d'assurance responsabilité civile. Les pièces administratives cessent d'être éparpillées entre boîte mail et disque dur."},
    {x:95,y:19.5,t:"Téléchargeable à tout moment",d:"Chaque document se récupère en un clic."},
    {x:93,y:11.5,t:"Ajouter un document",d:"Tout fichier utile au mariage se dépose ici, et les mariés y ont accès comme vous. Ils peuvent également charger des documents pour vous les partager."}
   ]}
];

var st = {m:0, hs:-2, intro:true};
var shot=document.getElementById('shot'), dots=document.getElementById('dots'),
    card=document.getElementById('card'), cover=document.getElementById('cover'),
    intro=document.getElementById('intro'), counter=document.getElementById('counter');
M.forEach(function(m){ var i=new Image(); i.src=m.img; });

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function render(){
  var mod=M[st.m], hs=st.hs, a=(hs>=0?mod.h[hs]:null);

  intro.style.opacity = st.intro?'1':'0';
  intro.style.visibility = st.intro?'visible':'hidden';
  intro.style.pointerEvents='none';

  var onCover = (hs===-2);
  cover.style.opacity = onCover?'1':'0';
  cover.style.visibility = onCover?'visible':'hidden';
  cover.style.transform = onCover?'none':'translateY(-14px)';
  cover.style.pointerEvents='none';
  cover.innerHTML='<div style="max-width:720px;">'+
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">'+
    '<span style="font-family:Marcellus,serif;font-size:17px;color:#FFF;background:#64313E;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;">'+String(st.m+1).padStart(2,'0')+'</span>'+
    '<span style="font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:#6B7780;">'+(mod.group==='app'?'Application':'Dossier mariage')+'</span></div>'+
    '<h2 style="font-family:Marcellus,serif;font-size:clamp(26px,3.6vw,52px);line-height:1.1;margin:0 0 18px;">'+esc(mod.title)+'</h2>'+
    '<p style="margin:0;font-size:clamp(14px,1.4vw,19px);line-height:1.6;color:#5C6E76;">'+esc(mod.intro)+'</p>'+
    '<div style="height:1px;background:#DCE2E5;margin:28px 0 0;max-width:200px;"></div></div>';

  shot.style.backgroundImage="url('"+mod.img+"')";
  shot.style.animation='shot .85s cubic-bezier(.22,.61,.36,1) both';
  var z=1.12;
  if(a){
    var lim=50-50/z, cl=function(v){return Math.max(-lim,Math.min(lim,v));};
    shot.style.transform='scale('+z+') translate('+cl((a.x-50)/z+50-a.x).toFixed(2)+'%,'+cl((a.y-50)/z+50-a.y).toFixed(2)+'%)';
  } else { shot.style.transform='scale(1)'; }

  dots.innerHTML = mod.h.map(function(h,i){
    var on=(i===hs);
    return '<button class="dot'+(on?' on':'')+'" style="left:'+h.x+'%;top:'+h.y+'%;opacity:'+(a&&!on?'.38':'1')+'" onclick="pick('+i+')">'+
      ((on||!a)?'<span class="ring"></span>':'')+'<span style="position:relative;z-index:2;">'+(i+1)+'</span></button>';
  }).join('');

  if(a){
    var w=Math.min(320, Math.round(document.getElementById('stage').clientWidth*0.42));
    var hz = a.x<=50 ? 'left:calc('+a.x+'% + 26px);max-width:calc('+(100-a.x)+'% - 34px);'
                     : 'right:calc('+(100-a.x)+'% + 26px);max-width:calc('+a.x+'% - 34px);';
    var vt = a.y<=50 ? 'top:calc('+a.y+'% - 16px);max-height:calc('+(100-a.y)+'% - 2px);'
                     : 'bottom:calc('+(100-a.y)+'% - 16px);max-height:calc('+a.y+'% - 2px);';
    card.style.cssText='position:absolute;z-index:5;'+hz+vt+'width:'+w+'px;overflow-y:auto;background:#FFF;border:1px solid #DCE2E5;border-radius:13px;padding:18px;box-shadow:0 18px 40px rgba(18,38,46,.18);transform-origin:'+(a.x<=50?'left ':'right ')+(a.y<=50?'top':'bottom')+';animation:cardIn .85s cubic-bezier(.22,.61,.36,1) both;';
    card.innerHTML='<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;">'+
      '<span style="width:23px;height:23px;border-radius:50%;background:#64313E;color:#FFF;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;">'+(hs+1)+'</span>'+
      '<span style="font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:#7C6B57;">'+esc(mod.title)+'</span></div>'+
      '<h3 style="font-family:Marcellus,serif;font-size:19px;line-height:1.25;margin:0 0 9px;">'+esc(a.t)+'</h3>'+
      '<p style="margin:0;font-size:13.5px;line-height:21px;color:#5C6E76;">'+esc(a.d)+'</p>';
  } else { card.style.display='none'; card.style.cssText='display:none;'; }

  counter.textContent = st.intro ? 'Démo Nupsio' : 'Module '+(st.m+1)+'/'+M.length+' · '+(hs===-2?'introduction':hs===-1?"vue d'ensemble":'point '+(hs+1)+'/'+mod.h.length);
}

function pick(i){ st.hs = (st.hs===i ? -1 : i); render(); }

function step(d){
  if(st.intro){ if(d>0){ st.intro=false; st.m=0; st.hs=-2; render(); } return; }
  if(d<0 && st.m===0 && st.hs===-2){ st.intro=true; render(); return; }
  var n=st.hs+d;
  if(n>=-2 && n<M[st.m].h.length){ st.hs=n; render(); return; }
  var nm=(st.m+(d>0?1:-1)+M.length)%M.length;
  st.m=nm; st.hs=(d>0?-2:M[nm].h.length-1); render();
}

window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); step(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); }
});
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
